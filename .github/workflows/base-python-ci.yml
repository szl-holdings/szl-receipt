# Standard Python gate for the szl-holdings estate: ruff + pytest on the two
# supported interpreters. This repository intentionally replaces the template's
# floating pip installs with its committed uv.lock; keep the test/lint scope in
# sync with alignment/templates/workflows/base-python-ci.yml.
name: base-python-ci

on:
  pull_request: null
  push:
    branches:
    - main
    - master
  merge_group:
    types:
    - checks_requested
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      # Org policy: every action is pinned to a full-length commit SHA.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.17"
          python-version: ${{ matrix.python-version }}

      - name: Require and sync the committed dependency graph
        run: |
          uv lock --check
          uv sync --frozen --extra dev

      # Blocking scope is the classes that indicate real breakage (syntax
      # errors, undefined names, unused imports). The full default ruleset runs
      # non-blocking so repos keep visibility without a forced flag day; repos
      # with their own ruff config in pyproject.toml already get stricter
      # behavior from their primary CI.
      - name: "Ruff (blocking: E9/F)"
        run: uv run --frozen --extra dev ruff check . --output-format github --select E9,F

      - name: Ruff (full ruleset, informational)
        run: uv run --frozen --extra dev ruff check . --statistics --exit-zero

      # The base gate owns tests/ only. Suites living elsewhere (scripts/,
      # tools/) are exercised by each repo's dedicated workflows with their
      # own dependency pins; collecting them here would fail on imports this
      # minimal install does not provide. Repos with no tests/ skip honestly.
      - name: Pytest (blocking)
        run: uv run --frozen --extra dev pytest -q tests
