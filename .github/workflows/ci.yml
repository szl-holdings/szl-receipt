name: CI

on:
  push:
    branches:
    - '**'
  pull_request:
    branches:
    - '**'
  merge_group:
    types:
    - checks_requested
    branches:
    - '**'
permissions:
  contents: read

jobs:
  test:
    name: pytest (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.17"
          python-version: ${{ matrix.python-version }}

      - name: Require the committed dependency graph
        run: uv lock --check

      - name: Sync package + dev dependencies
        run: uv sync --frozen --extra dev

      - name: Run pytest
        run: uv run --frozen --extra dev pytest -q

      - name: Receipt to lake append/readback contract
        run: >-
          uv run --frozen --extra dev python
          conformance/lake_append_readback.py
          --vector conformance/interoperability/V06-lake-append-readback.json

      - name: Strict receipt cross-verifier benchmark
        run: >-
          uv run --frozen --extra dev python
          conformance/benchmark_verifiers.py
          --require-openssl --output verifier-benchmark.json

      - name: Retain public SAMPLE verification receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: receipt-verifier-benchmark-${{ matrix.python-version }}
          path: verifier-benchmark.json
          if-no-files-found: error
