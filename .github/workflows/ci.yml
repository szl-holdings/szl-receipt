name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions: {contents: read}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix: {python: ["3.11", "3.12"]}
    steps:
      - uses: actions/checkout@08c890d416ceef5c5ac4bbc71393b68ea3eb690c # v5.0.2
      - uses: astral-sh/setup-uv@0a8b57b6d1c605274f39ada9291c500e12b32a09 # v6.0.0
      - uses: actions/setup-python@e797f83af5d1bb601b85b8e2370926db8c02ac00 # v5.0.0
        with: {python-version: ${{ matrix.python }}}
      - run: uv pip install --system -e .[dev]
      - run: pytest -q
