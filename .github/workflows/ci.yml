name: CI

on:
  push:
    branches:
    - '**'
  pull_request:
    branches:
    - '**'
  merge_group:
    types:
    - checks_requested
    branches:
    - '**'
permissions:
  contents: read

jobs:
  test:
    name: pytest (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package + dev dependencies
        run: pip install -e ".[dev]"

      - name: Run pytest
        run: pytest -q

      - name: Strict receipt cross-verifier benchmark
        run: python conformance/benchmark_verifiers.py --require-openssl --output verifier-benchmark.json

      - name: Retain public SAMPLE verification receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: receipt-verifier-benchmark-${{ matrix.python-version }}
          path: verifier-benchmark.json
          if-no-files-found: error
