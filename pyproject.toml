[build-system]
# Keep the PEP 517 backend exact because `python -m build` creates an isolated
# environment. Hatchling 1.32+ emits Core Metadata 2.5, which the current
# release checker (Twine 6.2) does not yet accept.
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[project]
name = "szl-receipt-dsse"
version = "0.3.4"
description = "Shared signed-receipt library for SZL components — DSSE/ECDSA-P256-SHA256 signing on maintained libraries (verified against in-toto-attestation 0.9.3 + cryptography 50.0.1; cosign-compatible, UNSIGNED-honest fallback) plus in-toto/SLSA-shaped attestation and EU AI Act / NIST AI RMF compliance-evidence mapping."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
# Pinned per the v11 doctrine §7.1 (no hand-rolled DSSE/crypto; B-08).
dependencies = [
    # Verified against cryptography 50.0.1 and in-toto-attestation 0.9.3 (see
    # [tool.szl.release].verified_against). Ranges, not exact pins: a library
    # that pins exact versions cannot coexist with any other package in the
    # same environment that resolves either dependency differently.
    "cryptography>=42,<60",
    "in-toto-attestation>=0.9.3,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "ruff>=0.15,<0.16",
]
release = [
    "build>=1.2,<2",
    "hatchling==1.31.0",
    "twine>=6.1,<7",
]

[tool.uv]
# Preserve the library's compatibility ranges while resolving the reproducible
# development/release environment to the exact versions used for DSSE and
# in-toto conformance.  uv.lock carries the transitive wheels and hashes.
constraint-dependencies = [
    "cryptography==50.0.1",
    "in-toto-attestation==0.9.3",
]
# Constrain isolated builds resolved by uv to the same backend recorded in the
# release graph. The exact PEP 517 requirement above also binds `python -m build`.
build-constraint-dependencies = [
    "hatchling==1.31.0",
]

[project.urls]
Homepage = "https://github.com/szl-holdings/szl-receipt"
Source = "https://github.com/szl-holdings/szl-receipt"
Issues = "https://github.com/szl-holdings/szl-receipt/issues"
Changelog = "https://github.com/szl-holdings/szl-receipt/releases"

[tool.hatch.build.targets.wheel]
packages = ["src/szl_receipt"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.szl.release]
import_names = ["szl_receipt"] # wheel top-level import names; the release gate fails if the built wheel differs
verified_against = { cryptography = "50.0.1", in-toto-attestation = "0.9.3" } # exact versions the DSSE/PAE conformance suite was last run against
