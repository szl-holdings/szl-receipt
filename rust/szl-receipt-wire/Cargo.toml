[package]
name = "szl-receipt-wire"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Research-only DSSE PAE byte-compatibility kernel for SZL receipts"
license = "Apache-2.0"
publish = false

[lib]
name = "szl_receipt_wire"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "szl-receipt-wire-cli"
path = "src/bin/wire.rs"

[features]
default = []
python = ["dep:pyo3"]

[dependencies]
pyo3 = { version = "0.27.1", optional = true, features = ["extension-module", "abi3-py310"] }
