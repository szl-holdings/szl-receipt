[build-system]
requires = ["maturin>=1.10,<2"]
build-backend = "maturin"

[project]
name = "szl-receipt-wire"
version = "0.1.0"
description = "Source-only Rust DSSE pre-authentication encoding (no cryptographic verification)"
requires-python = ">=3.10"
license = "Apache-2.0"
classifiers = ["Programming Language :: Python :: 3", "Programming Language :: Rust"]

[tool.maturin]
bindings = "pyo3"
features = ["python"]
